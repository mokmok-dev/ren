[workspace]
members = ["ren", "ren-workflow"]
resolver = "3"

[workspace.dependencies]
clap = { version = "4.6.4", features = ["derive"] }
ren-workflow = { path = "./ren-workflow" }
rhai = { version = "1.23.6", features = ["no_time", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.19"

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
nursery = "deny"
panic = "deny"
pedantic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
future_incompatible = "deny"
unsafe_code = "deny"
unused = "deny"

[workspace.package]
edition = "2024"
version = "0.0.0"
