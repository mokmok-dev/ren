[workspace]
members = ["ren", "ren-memory", "ren-workflow"]
resolver = "3"

[workspace.dependencies]
clap = { version = "4.6.4", features = ["derive"] }
fs2 = "0.4.3"
ignore = "0.4.23"
jiff = "0.2.18"
ren-memory = { path = "./ren-memory" }
ren-workflow = { path = "./ren-workflow" }
rhai = { version = "1.23.6", features = ["no_time", "serde"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.19"
toml_edit = { version = "0.25.13", features = ["serde"] }
ulid = "3.0.0"
yaml_serde = "0.10.4"

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
nursery = "deny"
panic = "deny"
pedantic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
future_incompatible = "deny"
unsafe_code = "deny"
unused = "deny"

[workspace.package]
edition = "2024"
version = "0.0.0"
